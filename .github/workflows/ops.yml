# Port to Cloudflare, phase 1: a full copy of the live Supabase project in a private R2 bucket.
# Manual only (workflow_dispatch). This repo is PUBLIC, so the logs are public: they show
# file names chosen by this workflow, file sizes, table names and row counts, nothing else.
# Never rows, emails, phones, password hashes, object names, the project URL or a connection
# string. No upload-artifact: the files go to R2 only.
#
# Actions:
#   export  pg_dump of the public, auth and storage schemas (custom format), a plain schema-only
#           dump, exact row counts, and every file in the public storage buckets, uploaded to
#           R2 tmfoodstuff-backups/supabase/<UTC date>/ with a pointer at supabase/latest.json.
#           Reads Supabase only; writes only to that bucket.
name: Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: export (read only on Supabase, writes the copy to R2)
        type: choice
        options: [export]
        default: export
      supabase_url:
        description: 'Optional: the public project URL (https://<ref>.supabase.co). Empty: taken from the repo variable SUPABASE_URL, else worked out from SUPABASE_DB_URL.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: tmf-ops
  cancel-in-progress: false

jobs:
  export:
    if: inputs.action == 'export'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL_INPUT: ${{ inputs.supabase_url || vars.SUPABASE_URL }}
      BUCKET: tmfoodstuff-backups
    steps:
      - uses: actions/checkout@v7

      - name: Preflight
        run: |
          for v in DB_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is empty or missing"; exit 1; fi
          done
          # pg_dump must be at least the server's version: take 17 from the PGDG repo.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/psql "$DB_URL" -X -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null && echo "Database reachable"
          echo "Server version: $(/usr/lib/postgresql/17/bin/psql "$DB_URL" -X -tAc 'show server_version' | cut -d' ' -f1)"

      - name: Work out the project URL
        run: python3 scripts/port/supabase-url.py

      - name: Dump the database
        run: |
          mkdir -p out
          pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage -f out/tmf.dump
          pg_dump "$DB_URL" --schema-only --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage -f out/tmf-schema.sql
          ls -l out | awk 'NR>1 {print $5, $9}'

      - name: Count rows
        run: |
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -tA -F $'\t' -f scripts/port/counts.sql > counts.tsv
          # objects.tsv holds object names: it stays on the runner and is never printed.
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -tA -F $'\t' -c \
            "select b.id, b.public::text, o.name from storage.objects o join storage.buckets b on b.id = o.bucket_id order by b.id, o.name" > objects.tsv
          python3 scripts/port/counts.py counts.tsv out/counts.json objects.tsv
          cat out/counts.json

      - name: Download the storage files
        run: |
          python3 scripts/port/fetch-storage.py objects.tsv files
          tar -czf out/files.tar.gz -C files .
          echo "files.tar.gz: $(stat -c %s out/files.tar.gz) bytes, $(tar -tzf out/files.tar.gz | grep -vc '/$') files"
          rm -f objects.tsv

      - name: Upload to R2
        run: |
          DAY=$(date -u +%Y-%m-%d)
          if ! npx --yes wrangler@4 r2 bucket info "$BUCKET" >/dev/null 2>&1; then
            npx --yes wrangler@4 r2 bucket create "$BUCKET" >/dev/null
            echo "Created bucket $BUCKET (private, no public access, no custom domain)"
          fi
          for f in tmf.dump tmf-schema.sql counts.json files.tar.gz; do
            npx --yes wrangler@4 r2 object put "$BUCKET/supabase/$DAY/$f" --file "out/$f" --remote >/dev/null
            echo "uploaded supabase/$DAY/$f ($(stat -c %s "out/$f") bytes)"
          done
          printf '{"day":"%s","ranAt":"%s"}\n' "$DAY" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > out/latest.json
          npx --yes wrangler@4 r2 object put "$BUCKET/supabase/latest.json" --file out/latest.json --remote >/dev/null
          echo "pointer supabase/latest.json -> $DAY"
          {
            echo "### Supabase export"
            echo ""
            echo "R2: \`$BUCKET/supabase/$DAY/\`"
            echo ""
            echo "| file | bytes |"; echo "|---|---|"
            for f in tmf.dump tmf-schema.sql counts.json files.tar.gz; do echo "| $f | $(stat -c %s "out/$f") |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: rm -rf out files counts.tsv objects.tsv
